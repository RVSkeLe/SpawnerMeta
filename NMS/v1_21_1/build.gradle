plugins {
    id "java"
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.19"
}

dependencies {
    paperweightDevelopmentBundle(
            "io.papermc.paper:dev-bundle:1.21.1-R0.1-SNAPSHOT"
    )

    compileOnly project(":common")
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
